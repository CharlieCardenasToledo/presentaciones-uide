      "notes": "Abrir con el reto del sistema de matrícula sin definir nada todavía: dos consumidores distintos para el mismo servicio de comprobantes. Pedir que anoten si un solo contrato de API les serviría a los dos. Las tres ideas de la semana son: qué costó la reutilización en la SOA, cómo se fija un contrato de API (REST, gRPC o AsyncAPI) y cómo cambiarlo sin romper a nadie."

      "startTime": 19.599999999999998,
      "endTime": 33,
      "notes": "SOA significa Arquitectura Orientada a Servicios. Primer avance: un servicio es una capacidad del negocio, por ejemplo crear un cliente, y por dentro tiene sus reglas y sus datos. Segundo avance: el contrato es lo único que se muestra hacia afuera, dice cómo pedir y qué se recibe, sin mostrar cómo lo hace. Tercer avance: varias divisiones piden lo mismo al mismo servicio; el objetivo era no escribir dos veces el mismo código. Fuente: Richards y Ford (2020).",

    {

      "endTime": 46.4,
      "notes": "Aquí está la paradoja de la SOA. Seis divisiones usan un mismo servicio Customer, y esa reutilización ahorra escribir código. Primer avance: alguien cambia la interfaz del servicio. Segundo avance: el cambio llega a todos los consumidores a la vez, como fichas de dominó, y todos se rompen. Tercer avance: por eso ya no se puede cambiar de a poco, hay que desplegar y probar todo junto. Reutilizar ahorra código pero cobra en acoplamiento. Fuente: Richards y Ford (2020).",

    {
      "sceneId": "sync-figura",
      "startTime": 46.4,
      "endTime": 62,
      "notes": "Dos formas de comunicarse. Arriba, síncrona: el cliente manda la solicitud y se queda esperando, como en una llamada telefónica; solo sigue cuando llega la respuesta. Abajo, asíncrona: el emisor deja un mensaje en un intermediario llamado broker y sigue con lo suyo, como al dejar un correo; el broker lo entrega después a quienes les interese, y el emisor ni siquiera sabe quiénes son. Si un proceso cruza varios servicios, puede dirigirlo un cerebro central (orquestación) o cada servicio puede reaccionar por su cuenta (coreografía). Fuente: Newman (2015).",
      "fragments": [

    {
      "sceneId": "estilos",
      "startTime": 62,
      "endTime": 74.8,
      "notes": "Tres maneras de fijar el contrato. REST: recursos con una dirección web y los verbos de HTTP; es lo más fácil de consumir desde cualquier lugar, por eso es lo típico de las APIs públicas. gRPC: llamadas binarias muy rápidas descritas en un archivo .proto; conviene para servicios internos que se hablan mucho. AsyncAPI: describe mensajes que pasan por un buzón intermedio llamado broker, para cuando el emisor no debe esperar ni conocer a los consumidores. No hay un ganador: depende de qué tan tolerante debe ser la relación a la latencia y al cambio. Fuente: Newman (2015).",
      "fragments": [
        64.6,
        67.6,
        70.6,
        73.6

    {
      "sceneId": "rest",

      "endTime": 89.39999999999999,
      "notes": "Ejemplo con la reserva de un laboratorio, que no es el recurso de la práctica. La dirección identifica el recurso y el verbo dice qué hacer. Primer avance: GET /reservas/12 consulta; el servicio devuelve la reserva 12 y no cambia nada. Segundo: POST /reservas crea una nueva; aparece la reserva 13. Tercero: PUT /reservas/12 reemplaza los datos de la 12. Fíjense que la ruta nunca lleva la acción: no existe /crearReserva. Fuente: Newman (2015).",
      "fragments": [

      "sceneId": "grpc",

      "endTime": 99.99999999999999,
      "notes": "El mismo recurso en gRPC. El contrato vive en un archivo .proto, que lista las operaciones y los mensajes; cada campo lleva un número. Primer avance: desde ese único archivo se genera código tanto para el cliente como para el servicio, así que los dos hablan exactamente el mismo contrato y nadie arma direcciones a mano. Segundo avance: la llamada viaja en binario y lo que identifica a cada campo es su número, no su nombre; por eso se puede cambiar el nombre de un campo sin romper a nadie, pero no su número. En PE-S2 escribirán un .proto corto de esta forma. Fuente: Newman (2015).",

      "notes": "La mejor manera de evitar el daño de un cambio es no provocarlo. A la izquierda, la respuesta del servicio de comprobantes con sus campos. El sistema contable solo necesita el número y el monto. Primer avance: el cliente toma esos dos campos e ignora el resto. Segundo avance: el servicio agrega un campo nuevo, el descuento; como el cliente solo lee lo que necesita, ni se entera y sigue funcionando. Fuente: Newman (2015).",

    {
      "sceneId": "coexistir",
      "startTime": 134.99999999999997,
      "endTime": 148.99999999999997,
      "notes": "Si ni el versionado evita romper a un cliente, se usa la coexistencia de endpoints. Situación inicial: tres clientes de equipos distintos usan la versión 1. Primer avance: el servicio publica la versión 2 y deja la 1 funcionando, así nadie se rompe. Segundo: los clientes A y B migran a la 2 cuando pueden. Tercero: el cliente C migra; cuando nadie usa la versión 1, se retira. Así los equipos no tienen que actualizarse el mismo día. Fuente: Newman (2015).",
      "fragments": [
        137.59999999999997,

        147.79999999999995

    {
      "sceneId": "compat",
      "startTime": 148.99999999999997,
      "endTime": 159.59999999999997,
      "notes": "Dos garantías con nombre. Compatibilidad hacia atrás: el código nuevo puede leer lo que produjeron versiones anteriores; arriba, un cliente viejo manda un pedido de la versión 1 y el servicio nuevo lo entiende. Compatibilidad hacia adelante: el código antiguo puede procesar lo que producen versiones nuevas, normalmente ignorando los campos que no conoce; abajo, el servicio nuevo responde con un campo extra y el cliente viejo lo ignora. En servicios, el servidor suele actualizarse antes que sus clientes, así que hace falta hacia atrás en lo que recibe y hacia adelante en lo que envía. Fuente: Kleppmann (2017).",

        158.39999999999998

    {
      "sceneId": "micro-figura",
      "startTime": 159.59999999999997,
      "endTime": 170.59999999999997,
      "notes": "Los microservicios nacen en 2014, nombrados por Fowler y Lewis, como respuesta explícita a la SOA de servicios grandes y atados. La diferencia más importante es dónde viven los datos. A la izquierda, SOA: tres servicios escriben en una misma base. A la derecha, microservicios: cada servicio es dueño de su propia base. Primer avance: se cambia el esquema de la base compartida y los tres servicios quedan afectados. Segundo: en microservicios se cambia la base de un solo servicio y los otros dos siguen igual. A cambio, cuesta coordinar lo que antes resolvía una sola base compartida. Fuente: Richards y Ford (2020).",
