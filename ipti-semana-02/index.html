      "notes": "Abrir con el reto del sistema de matrícula sin definir nada todavía: dos consumidores distintos para el mismo servicio de comprobantes. Pedir que anoten si un solo contrato de API les serviría a los dos. Las tres ideas de la semana son: qué costó la reutilización en la SOA, cómo se fija un contrato de API (REST, gRPC o AsyncAPI) y cómo cambiarlo sin romper a nadie."

      "endTime": 24,
      "notes": "SOA significa Arquitectura Orientada a Servicios. La idea: en lugar de resolver cada integración por separado, se construyen servicios que toda la empresa reutiliza. Un servicio es una capacidad del negocio, por ejemplo registrar un cliente, con un contrato que dice cómo pedírsela. La promesa era no reescribir código. Fuente: Richards y Ford (2020).",

    {
      "sceneId": "sync-figura",
      "startTime": 34,
      "endTime": 39.6,
      "notes": "La primera decisión al diseñar un contrato es si la comunicación es síncrona o asíncrona. Síncrona: el cliente pregunta y se queda esperando la respuesta, como una llamada telefónica. Asíncrona: el emisor deja un mensaje y sigue con lo suyo, como un correo; un intermediario llamado broker lo reparte a quien corresponda. En el síncrono los dos quedan atados en el tiempo; en el asíncrono el emisor ni siquiera conoce a los consumidores. Si un proceso cruza varios servicios, puede dirigirlo un cerebro central (orquestación) o cada servicio puede reaccionar por su cuenta (coreografía); los eventos llevan naturalmente a la segunda. Fuente: Newman (2015)."
    },
    {
      "sceneId": "estilos",
      "startTime": 39.6,
      "endTime": 48,
      "notes": "Tres maneras de fijar el contrato. REST: recursos con una dirección web y los verbos de HTTP; es lo más fácil de consumir desde cualquier lugar, por eso es lo típico de las APIs públicas. gRPC: llamadas binarias muy rápidas descritas en un archivo .proto; conviene para servicios internos que se hablan mucho. AsyncAPI: describe mensajes que pasan por un broker, para cuando el emisor no debe esperar ni conocer a los consumidores, y para amortiguar picos de carga. No hay un ganador: depende de qué tan tolerante debe ser la relación a la latencia y al cambio. Fuente: Newman (2015).",

      "notes": "El mismo recurso en gRPC. El contrato vive en un archivo .proto: un servicio con sus operaciones y los mensajes de pedido y respuesta. Observar el detalle clave: cada campo lleva un número, y ese número, no el nombre, identifica el campo al viajar en binario. Por eso se puede cambiar el nombre de un campo sin romper a nadie, pero no su número. Desde el archivo, el cliente genera código ya tipado y no arma direcciones a mano. En PE-S2 reescribirán su contrato REST de esta forma. Fuente: Newman (2015).",

      "endTime": 71,

    {
      "sceneId": "tolerante",
      "startTime": 71,
      "endTime": 79.4,
      "notes": "La mejor manera de evitar el daño de un cambio es no provocarlo. Con el lector tolerante, el cliente toma solo los campos que necesita e ignora el resto; así, si el servicio agrega campos nuevos, el cliente ni se entera. Es la ley de Postel: ser conservador en lo que se envía y liberal en lo que se acepta. Aplicado al comprobante: el sistema contable lee solo número y monto, y no le importa que se agregue otro campo. Fuente: Newman (2015).",

      "notes": "Cuando el cambio es inevitable se avisa con tres números: MAYOR.MENOR.PARCHE. Un parche corrige errores sin cambiar el comportamiento. Un cambio menor agrega algo y es compatible: un cliente hecho para la 1.2.0 debe seguir funcionando con la 1.3.0. Un cambio mayor rompe la compatibilidad: no se puede asumir lo mismo si el servicio salta a la 2.0.0. Fuente: Newman (2015).",

      "startTime": 87.80000000000001,
      "endTime": 94.20000000000002,
      "notes": "Si ni el versionado evita romper a un cliente, se usa la coexistencia de endpoints. El servicio publica la versión nueva y deja funcionando la anterior; los clientes migran cuando pueden, sin presión; y solo cuando ya nadie usa la vieja se retira. Así los equipos distintos no tienen que actualizarse el mismo día. Fuente: Newman (2015)."
