      "notes": "Kief Morris describe el tránsito entre dos eras de la infraestructura. En la Era del Hierro los sistemas corren sobre hardware físico: aprovisionar un servidor toma semanas y los cambios se hacen con procesos manuales, guiados por interfaz gráfica o acceso físico al equipo. En la Era de la Nube los recursos están virtualizados, el aprovisionamiento toma minutos y los procesos pueden automatizarse de punta a punta. La diferencia no es solo de velocidad: un servidor deja de ser un objeto que se inspecciona a simple vista y pasa a ser un recurso que una herramienta puede consultar y modificar mediante una llamada de red. Los días del ticket son ilustrativos. Fuente: Morris (2021), Infrastructure as Code.",

    {
      "sceneId": "iac",
      "startTime": 24,
      "endTime": 30.5,
      "notes": "Un recurso programable por API todavía puede gestionarse a mano, clic a clic, sobre la consola web del proveedor. Lo que lo convierte en disciplina de ingeniería es la infraestructura como código: un enfoque de automatización basado en prácticas del desarrollo de software, donde se editan cambios en código y la automatización prueba y aplica esos cambios a los sistemas reales. Se apoya en tres prácticas núcleo. Primera, definir todo como código: cada recurso existe primero como texto versionable y no como configuración hecha a mano que vive en la memoria de quien la aplicó. Segunda, probar y entregar continuamente todo el trabajo en progreso. Tercera, construir piezas pequeñas y simples que cambian de forma independiente. La tercera se retoma al hablar de radio de impacto. Fuente: Morris (2021).",

      "sceneId": "declarativo",

      "endTime": 38,
      "notes": "Morris distingue dos paradigmas de lenguaje. El declarativo especifica el estado final deseado, sin detallar los pasos; la herramienta compara ese estado contra el estado real y calcula la diferencia. Por eso, al ejecutar dos veces el mismo archivo de Terraform, la primera corrida crea los recursos y la segunda, sin cambios en el código, informa que no hay nada que hacer. El imperativo-programable especifica una secuencia de instrucciones en un lenguaje de propósito general, con bucles y condicionales, para construir los recursos paso a paso. Terraform usa HCL, un lenguaje declarativo. Pulumi usa TypeScript, Python, Go u otros. Esta lámina es el modelo del fragmento declarativo que pide la PE-S4. Fuente: Morris (2021).",

      "notes": "La tabla compara las dos herramientas en los tres criterios que pide la PE-S4: lenguaje, lógica dinámica y caso de uso ideal. Terraform representa el paradigma declarativo: su lenguaje HCL es un DSL pensado para describir recursos de forma directa. Pulumi representa el imperativo-programable: sustituye el DSL por lenguajes de propósito general, lo que permite aprovechar autocompletado, refactorización y pruebas unitarias. Para el caso de Matrícula y Pagos, el clúster de inscripción es una topología relativamente estática que se repite cada semestre con pocos parámetros variables: un módulo declarativo de Terraform resulta más apropiado que una librería completa de Pulumi. Insistir en que la elección se justifica con el nivel de lógica dinámica del escenario, no con la popularidad de la herramienta. Fuente: Morris (2021).",

    {
      "sceneId": "principios",
      "startTime": 59.5,
      "endTime": 67,
      "notes": "Segundo bloque, después de la práctica. Separar el código declarativo del imperativo resuelve cómo se escribe la infraestructura; queda pendiente cómo se gobierna una vez que existe y debe cambiar, fallar o desaparecer sin intervención manual. Morris propone principios de diseño. Primero, asumir que los sistemas no son confiables: un servidor virtual, un disco o la red pueden fallar en cualquier momento, y el sistema debe seguir funcionando a pesar de eso. Segundo, hacer todo reproducible: cualquier servidor debe poder reconstruirse desde cero a partir del código. Tercero, crear cosas desechables: los recursos deben poder agregarse, eliminarse o reemplazarse sin fricción. Cuarto, minimizar la variación: mantener idénticas las piezas parecidas. Son los cuatro principios de la rúbrica de la TA-S4, que se aplican a un servidor real de la UIDE. Fuente: Morris (2021).",

      "endTime": 80,
      "notes": "Cuando dos entornos que deberían ser idénticos divergen con el tiempo por parches manuales o ejecuciones inconsistentes, ocurre la deriva de configuración. La infraestructura inmutable evita el problema de raíz: en lugar de modificar un servidor en ejecución, se crea una instancia nueva con la configuración actualizada, se prueba y se sustituye la antigua, que se destruye por completo. Es el principio de minimizar la variación convertido en propiedad del proceso y ya no en disciplina humana. La técnica blue-green aplica la misma idea: se crea una instancia paralela del stack, se conmuta el tráfico hacia ella y la anterior se destruye solo después de confirmar que la nueva funciona. Los valores de la tabla son un ejemplo. Fuente: Morris (2021).",

    {
      "sceneId": "ciclo",
      "startTime": 80,
      "endTime": 87.5,
      "notes": "Los principios se traducen en un ciclo de vida de tres fases. En el aprovisionamiento, la herramienta de gestión de stacks lee el código y traduce las declaraciones en llamadas a la API del proveedor para instanciar los recursos. En la gestión de cambios, el equipo reaplica el código de forma periódica para eliminar la deriva; si un cambio es demasiado riesgoso para aplicarse en el lugar, usa blue-green. En el desmantelamiento, los recursos se destruyen de forma limpia; los stacks de prueba efímeros se instancian para una ejecución del pipeline y se destruyen de inmediato, lo que evita recursos huérfanos y reduce el costo. Es el contenido de la segunda parte de la rúbrica de la TA-S4: tres fases y la técnica asociada a cada una. Fuente: Morris (2021).",

      "sceneId": "radio",
