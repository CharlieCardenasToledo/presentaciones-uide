<style>

.ln{position:absolute;background:#cfc6ca}

</style></head><body>

<svg style="position:absolute;left:0;top:0;width:1560px;height:720px" viewBox="0 0 1560 720" xmlns="http://www.w3.org/2000/svg">

<rect x="660" y="315" width="240" height="90" rx="6" fill="#910048"/>
<text x="780" y="372" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="800" font-size="34" fill="#fff">ESTUDIANTE</text>

<text id="n_tel" x="1190" y="136" text-anchor="middle" font-family="system-ui,sans-serif" font-size="26" font-weight="700" fill="#0c6b62" opacity="0">multivaluado</text>

</svg>
<div id="k0" class="t" style="left:40px;top:24px;width:560px;opacity:0;color:var(--wine-deep);font-size:32px">Un tipo de entidad se dibuja como un rectángulo con su nombre</div>
<div id="k1" class="t" style="left:40px;top:24px;width:560px;opacity:0;color:var(--wine-deep);font-size:32px">Cada atributo es un óvalo unido al rectángulo</div>
<div id="k2" class="t" style="left:40px;top:24px;width:560px;opacity:0;color:var(--wine-deep);font-size:32px">El nombre subrayado marca la clave; el óvalo doble, varios valores</div>
<div id="k3" class="t" style="left:40px;top:24px;width:560px;opacity:0;color:var(--wine-deep);font-size:32px">Un atributo compuesto reparte sus partes en óvalos más pequeños</div>
</div>
<script>
const N = 3;
const st = document.getElementById("st");
function fit() { const k = Math.min(innerWidth / 1560, innerHeight / 720); st.style.transform = "scale(" + k + ")"; }
fit(); addEventListener("resize", fit);
const $ = (s) => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const ease = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const win = (s, a, b) => ease((s - a) / (b - a));
const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, t) => { const x = hex(a), y = hex(b); return "rgb(" + x.map((v, i) => Math.round(v + (y[i] - v) * t)).join(",") + ")"; };
function lit(el, base, color, t, fg0, fg1) { el.style.background = mix(base, color, t); el.style.color = mix(fg0 || "#1f1a1d", fg1 || "#ffffff", t); }
function put(el, x, y, a) { el.style.transform = "translate(" + x + "px," + y + "px)"; el.style.opacity = String(a); }
function route(k, pts) { for (let i = 0; i < pts.length - 1; i++) { if (k <= pts[i + 1][0]) { const t = ease((k - pts[i][0]) / (pts[i + 1][0] - pts[i][0])); return [pts[i][1] + (pts[i + 1][1] - pts[i][1]) * t, pts[i][2] + (pts[i + 1][2] - pts[i][2]) * t]; } } const l = pts[pts.length - 1]; return [l[1], l[2]]; }

function caps(s, n, pref) { for (let k = 0; k <= n; k++) { const a = win(s, k - 0.5, k) * (k < n ? 1 - win(s, k, k + 0.5) : 1); put($("#" + pref + k), 0, 0, clamp(a, 0, 1)); } }
function rect(el, r) { el.style.left = r[0] + "px"; el.style.top = r[1] + "px"; el.style.width = r[2] + "px"; el.style.height = r[3] + "px"; }
function between(a, b, t) { return a.map((v, i) => v + (b[i] - v) * t); }

let u = 0, target = 0, frame = 0, timer = 0, last = 0;
function draw() { 
const s = u * N;
const a1 = win(s, 0, 1), a2 = win(s, 1, 2), a3 = win(s, 2, 3);
const op = (id, v) => { document.getElementById(id).setAttribute("opacity", String(v)); };
["ced", "fec", "tel", "cor", "eda", "nom"].forEach((k) => { op("l_" + k, a1); op("o_" + k, a1); });
op("doble", a2); op("sub", a2); op("n_ced", a2); op("n_tel", a2);
["nms", "ape"].forEach((k) => { op("l_" + k, a3); op("o_" + k, a3); });
op("n_nom", a3); op("n_nom2", a3);
caps(s, 3, "k");
 }
function loop() {
  clearTimeout(timer); cancelAnimationFrame(frame);
  const now = performance.now();
  const dt = last ? Math.min((now - last) / 1000, 1) : 1 / 60; last = now;
  const speed = 1 / (N * 1.6);
  u = target > u ? Math.min(target, u + dt * speed) : Math.max(target, u - dt * speed * 2);
  draw();
  if (u !== target) { frame = requestAnimationFrame(loop); timer = setTimeout(loop, 80); } else { frame = 0; timer = 0; last = 0; }
}
const run = () => { if (!frame && !timer) { last = 0; loop(); } };
const go = (v) => { target = clamp(v, 0, 1); run(); };
window.__fig = { set(v) { u = target = clamp(v, 0, 1); draw(); }, go, get u() { return u; } };
addEventListener("message", (e) => { const m = e.data; if (!m || m.type !== "fig") return; if (m.mode === "set") window.__fig.set(Number(m.value)); else go(Number(m.value)); });
if (window.parent !== window) {
  const KEYMAP = { ArrowRight: "ArrowRight", PageDown: "ArrowRight", " ": "ArrowRight", Enter: "ArrowRight", ArrowLeft: "ArrowLeft", PageUp: "ArrowLeft", Backspace: "ArrowLeft" };
  addEventListener("keydown", (e) => { const k = KEYMAP[e.key]; if (!k) return; e.preventDefault(); e.stopImmediatePropagation(); parent.postMessage({ type: "deck-key", key: k }, "*"); }, true);
} else {
  addEventListener("click", () => go(target >= 1 ? 0 : Math.min(1, Math.round(target * N + 1) / N)));
}
draw();
</script></body></html>
