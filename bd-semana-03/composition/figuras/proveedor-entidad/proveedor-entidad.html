<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Un atributo que pasa a ser entidad</title>
<style>
:root{--wine:#910048;--wine-deep:#6d0036;--gold:#e8a920;--teal:#0c6b62;--amber:#7a5200;--ink:#1f1a1d;--muted:#5a5257;--tint:#f6f1f3;--red:#b3261e}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;font-family:system-ui,"Segoe UI",sans-serif;color:var(--ink);overflow:hidden}
#st{position:absolute;left:0;top:0;width:1560px;height:720px;transform-origin:0 0}
.b{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border-radius:16px;padding:6px 14px;font-weight:700;font-size:32px;line-height:1.15;background:var(--tint);color:var(--ink)}
.b small{display:block;font-size:24px;font-weight:600;margin-top:4px}
.t{position:absolute;font-size:34px;font-weight:700;line-height:1.2}
.pill{position:absolute;display:flex;align-items:center;justify-content:center;height:52px;padding:0 20px;border-radius:26px;color:#fff;font:800 24px/1 ui-monospace,Consolas,monospace;white-space:nowrap;opacity:0;z-index:5}
.ln{position:absolute;background:#cfc6ca}

</style></head><body>
<div id="st">
<svg style="position:absolute;left:0;top:0;width:1560px;height:720px" viewBox="0 0 1560 720" xmlns="http://www.w3.org/2000/svg">
<line x1="400" y1="360" x2="780" y2="360" stroke="#910048" stroke-width="3"/>
<line x1="400" y1="360" x2="200" y2="190" stroke="#910048" stroke-width="3"/>
<line x1="400" y1="360" x2="200" y2="530" stroke="#910048" stroke-width="3"/>
<line id="l_tel" x1="780" y1="360" x2="1130" y2="170" stroke="#910048" stroke-width="3" opacity="0"/>
<line id="l_dir" x1="780" y1="360" x2="1250" y2="360" stroke="#910048" stroke-width="3" opacity="0"/>
<line id="l_ruc" x1="780" y1="360" x2="1130" y2="550" stroke="#910048" stroke-width="3" opacity="0"/>
<g><ellipse id="e_nombre" cx="200" cy="190" rx="85" ry="36" fill="#fff" stroke="#910048" stroke-width="3"/><text id="t_nombre" x="200" y="199" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="26" fill="#1f1a1d">nombre</text></g>
<g><ellipse id="e_precio" cx="200" cy="530" rx="80" ry="36" fill="#fff" stroke="#910048" stroke-width="3"/><text id="t_precio" x="200" y="539" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="26" fill="#1f1a1d">precio</text></g>
<g><ellipse id="e_prov" cx="780" cy="360" rx="115" ry="36" fill="#fff" stroke="#910048" stroke-width="3"/><text id="t_prov" x="780" y="369" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="26" fill="#1f1a1d">proveedor</text></g>
<g id="o_tel" opacity="0"><ellipse id="e_tel" cx="1130" cy="170" rx="95" ry="36" fill="#fff" stroke="#910048" stroke-width="3"/><text id="t_tel" x="1130" y="179" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="26" fill="#1f1a1d">teléfono</text></g>
<g id="o_dir" opacity="0"><ellipse id="e_dir" cx="1250" cy="360" rx="105" ry="36" fill="#fff" stroke="#910048" stroke-width="3"/><text id="t_dir" x="1250" y="369" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="26" fill="#1f1a1d">dirección</text></g>
<g id="o_ruc" opacity="0"><ellipse id="e_ruc" cx="1130" cy="550" rx="70" ry="36" fill="#fff" stroke="#910048" stroke-width="3"/><text id="t_ruc" x="1130" y="559" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="26" fill="#1f1a1d">RUC</text></g>
<rect id="r_prov" x="660" y="315" width="240" height="90" rx="6" fill="#910048" opacity="0"/>
<text id="t_PROV" x="780" y="372" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="800" font-size="34" fill="#fff" opacity="0">PROVEEDOR</text>
<line id="sub_ruc" x1="1098" y1="566" x2="1162" y2="566" stroke="#1f1a1d" stroke-width="3" opacity="0"/>
<rect x="290" y="315" width="220" height="90" rx="6" fill="#910048"/>
<text x="400" y="372" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="800" font-size="34" fill="#fff">PRODUCTO</text>
</svg>
<div id="k0" class="t" style="left:40px;top:640px;width:1480px;opacity:0;color:var(--wine-deep);font-size:32px">Al inicio, el proveedor es un dato más del producto</div>
<div id="k1" class="t" style="left:40px;top:640px;width:1480px;opacity:0;color:var(--wine-deep);font-size:32px">Meses después: teléfono, dirección y RUC del proveedor</div>
<div id="k2" class="t" style="left:40px;top:640px;width:1480px;opacity:0;color:var(--wine-deep);font-size:32px">El dato tiene atributos propios y existe sin un producto: pasa a ser entidad</div>
<div id="k3" class="t" style="left:40px;top:640px;width:1480px;opacity:0;color:var(--wine-deep);font-size:32px">Su clave sería el RUC: nunca se repite entre proveedores</div>
</div>
<script>
const N = 3;
const st = document.getElementById("st");
function fit() { const k = Math.min(innerWidth / 1560, innerHeight / 720); st.style.transform = "scale(" + k + ")"; }
fit(); addEventListener("resize", fit);
const $ = (s) => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const ease = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const win = (s, a, b) => ease((s - a) / (b - a));
const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, t) => { const x = hex(a), y = hex(b); return "rgb(" + x.map((v, i) => Math.round(v + (y[i] - v) * t)).join(",") + ")"; };
function lit(el, base, color, t, fg0, fg1) { el.style.background = mix(base, color, t); el.style.color = mix(fg0 || "#1f1a1d", fg1 || "#ffffff", t); }
function put(el, x, y, a) { el.style.transform = "translate(" + x + "px," + y + "px)"; el.style.opacity = String(a); }
function route(k, pts) { for (let i = 0; i < pts.length - 1; i++) { if (k <= pts[i + 1][0]) { const t = ease((k - pts[i][0]) / (pts[i + 1][0] - pts[i][0])); return [pts[i][1] + (pts[i + 1][1] - pts[i][1]) * t, pts[i][2] + (pts[i + 1][2] - pts[i][2]) * t]; } } const l = pts[pts.length - 1]; return [l[1], l[2]]; }

function caps(s, n, pref) { for (let k = 0; k <= n; k++) { const a = win(s, k - 0.5, k) * (k < n ? 1 - win(s, k, k + 0.5) : 1); put($("#" + pref + k), 0, 0, clamp(a, 0, 1)); } }
function rect(el, r) { el.style.left = r[0] + "px"; el.style.top = r[1] + "px"; el.style.width = r[2] + "px"; el.style.height = r[3] + "px"; }
function between(a, b, t) { return a.map((v, i) => v + (b[i] - v) * t); }

let u = 0, target = 0, frame = 0, timer = 0, last = 0;
function draw() { 
const s = u * N;
const a1 = win(s, 0, 1), a2 = win(s, 1, 2), a3 = win(s, 2, 3);
const op = (id, v) => { document.getElementById(id).setAttribute("opacity", String(v)); };
["tel", "dir", "ruc"].forEach((k) => { op("l_" + k, a1); op("o_" + k, a1); });
op("e_prov", 1 - a2); op("t_prov", 1 - a2); op("r_prov", a2); op("t_PROV", a2);
op("sub_ruc", a3);
caps(s, 3, "k");
 }
function loop() {
  clearTimeout(timer); cancelAnimationFrame(frame);
  const now = performance.now();
  const dt = last ? Math.min((now - last) / 1000, 1) : 1 / 60; last = now;
  const speed = 1 / (N * 1.6);
  u = target > u ? Math.min(target, u + dt * speed) : Math.max(target, u - dt * speed * 2);
  draw();
  if (u !== target) { frame = requestAnimationFrame(loop); timer = setTimeout(loop, 80); } else { frame = 0; timer = 0; last = 0; }
}
const run = () => { if (!frame && !timer) { last = 0; loop(); } };
const go = (v) => { target = clamp(v, 0, 1); run(); };
window.__fig = { set(v) { u = target = clamp(v, 0, 1); draw(); }, go, get u() { return u; } };
addEventListener("message", (e) => { const m = e.data; if (!m || m.type !== "fig") return; if (m.mode === "set") window.__fig.set(Number(m.value)); else go(Number(m.value)); });
if (window.parent !== window) {
  const KEYMAP = { ArrowRight: "ArrowRight", PageDown: "ArrowRight", " ": "ArrowRight", Enter: "ArrowRight", ArrowLeft: "ArrowLeft", PageUp: "ArrowLeft", Backspace: "ArrowLeft" };
  addEventListener("keydown", (e) => { const k = KEYMAP[e.key]; if (!k) return; e.preventDefault(); e.stopImmediatePropagation(); parent.postMessage({ type: "deck-key", key: k }, "*"); }, true);
} else {
  addEventListener("click", () => go(target >= 1 ? 0 : Math.min(1, Math.round(target * N + 1) / N)));
}
draw();
</script></body></html>
