<!doctype html>

<style>

<div id="st">
<svg style="position:absolute;left:0;top:0;width:1560px;height:720px" viewBox="0 0 1560 720" xmlns="http://www.w3.org/2000/svg"><g id="c_pert1" opacity="0"><line x1="170" y1="205" x2="355" y2="150" stroke="#910048" stroke-width="3"/></g><g id="c_pert2" opacity="0"><line x1="585" y1="150" x2="710" y2="205" stroke="#910048" stroke-width="3"/></g><g id="c_repr1" opacity="0"><line x1="170" y1="295" x2="345" y2="350" stroke="#910048" stroke-width="3"/></g><g id="c_repr2" opacity="0"><line x1="595" y1="350" x2="680" y2="295" stroke="#910048" stroke-width="3"/></g><g id="c_resv1" opacity="0"><line x1="895" y1="250" x2="1010" y2="250" stroke="#910048" stroke-width="3"/></g><g id="c_resv2" opacity="0"><line x1="1190" y1="250" x2="1300" y2="250" stroke="#910048" stroke-width="3"/></g><g id="c_tien1" opacity="0"><line x1="1410" y1="295" x2="1410" y2="424" stroke="#910048" stroke-width="3"/></g><g id="c_tien2" opacity="0"><line x1="1410" y1="476" x2="1410" y2="575" stroke="#910048" stroke-width="3"/></g><g id="c_acom1" opacity="0"><line x1="790" y1="295" x2="790" y2="574" stroke="#910048" stroke-width="3"/></g><g id="c_acom2" opacity="0"><line x1="875" y1="295" x2="875" y2="574" stroke="#910048" stroke-width="3"/></g><g id="e1" opacity="1"><rect x="55.0" y="205.0" width="230" height="90" rx="6" fill="#910048"/><text x="170" y="261.2" text-anchor="middle" font-family="system-ui,'Segoe UI',sans-serif" font-weight="800" font-size="32" fill="#fff">CARRERA</text></g><g id="e2" opacity="1"><rect x="645.0" y="205.0" width="250" height="90" rx="6" fill="#910048"/><text x="770" y="261.2" text-anchor="middle" font-family="system-ui,'Segoe UI',sans-serif" font-weight="800" font-size="32" fill="#fff">ESTUDIANTE</text></g><g id="e3" opacity="1"><rect x="1300.0" y="205.0" width="220" height="90" rx="6" fill="#910048"/><text x="1410" y="261.2" text-anchor="middle" font-family="system-ui,'Segoe UI',sans-serif" font-weight="800" font-size="32" fill="#fff">LIBRO</text></g><g id="e4" opacity="1"><rect x="1285.0" y="575.0" width="250" height="90" rx="6" fill="#910048"/><text x="1410" y="631.2" text-anchor="middle" font-family="system-ui,'Segoe UI',sans-serif" font-weight="800" font-size="32" fill="#fff">EJEMPLAR</text></g><g id="c_pp" opacity="0"><rect x="355.0" y="124.0" width="230" height="52" rx="26.0" fill="#910048"/><text x="470" y="159.1" text-anchor="middle" font-family="system-ui,'Segoe UI',sans-serif" font-weight="700" font-size="26" fill="#fff">pertenece a</text></g><g id="c_pr" opacity="0"><rect x="345.0" y="324.0" width="250" height="52" rx="26.0" fill="#910048"/><text x="470" y="359.1" text-anchor="middle" font-family="system-ui,'Segoe UI',sans-serif" font-weight="700" font-size="26" fill="#fff">representa a</text></g><g id="c_pv" opacity="0"><rect x="1010.0" y="224.0" width="180" height="52" rx="26.0" fill="#910048"/><text x="1100" y="259.1" text-anchor="middle" font-family="system-ui,'Segoe UI',sans-serif" font-weight="700" font-size="26" fill="#fff">reserva</text></g><g id="c_pt" opacity="0"><rect x="1335.0" y="424.0" width="150" height="52" rx="26.0" fill="#910048"/><text x="1410" y="459.1" text-anchor="middle" font-family="system-ui,'Segoe UI',sans-serif" font-weight="700" font-size="26" fill="#fff">tiene</text></g><g id="c_pa" opacity="0"><rect x="717.0" y="574.0" width="230" height="52" rx="26.0" fill="#910048"/><text x="832" y="609.1" text-anchor="middle" font-family="system-ui,'Segoe UI',sans-serif" font-weight="700" font-size="26" fill="#fff">acompaña a</text></g><g id="c_fe" opacity="0"><rect x="985.0" y="301.0" width="230" height="42" rx="21.0" fill="#fcefc9"/><text x="1100" y="330.4" text-anchor="middle" font-family="system-ui,'Segoe UI',sans-serif" font-weight="700" font-size="24" fill="#7a5200">con una fecha</text></g></svg>
<div id="k0" class="t" style="left:30px;top:540px;width:640px;opacity:0;color:var(--wine-deep);font-size:32px">Las fichas de la semana pasada, todavía sueltas</div>
<div id="k1" class="t" style="left:30px;top:540px;width:640px;opacity:0;color:var(--wine-deep);font-size:32px">Dos verbos unen estudiante y carrera</div>
<div id="k2" class="t" style="left:30px;top:540px;width:640px;opacity:0;color:var(--wine-deep);font-size:32px">Un verbo une estudiante y libro, y trae una fecha</div>
<div id="k3" class="t" style="left:30px;top:540px;width:640px;opacity:0;color:var(--wine-deep);font-size:32px">Un verbo une un libro con sus ejemplares</div>
<div id="k4" class="t" style="left:30px;top:540px;width:640px;opacity:0;color:var(--wine-deep);font-size:32px">Y un verbo une a un estudiante con otro estudiante</div>
</div>
<script>
const N = 4;
const st = document.getElementById("st");
function fit() { const k = Math.min(innerWidth / 1560, innerHeight / 720); st.style.transform = "scale(" + k + ")"; }
fit(); addEventListener("resize", fit);
const $ = (s) => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const ease = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const win = (s, a, b) => ease((s - a) / (b - a));
const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, t) => { const x = hex(a), y = hex(b); return "rgb(" + x.map((v, i) => Math.round(v + (y[i] - v) * t)).join(",") + ")"; };
function lit(el, base, color, t, fg0, fg1) { el.style.background = mix(base, color, t); el.style.color = mix(fg0 || "#1f1a1d", fg1 || "#ffffff", t); }
function put(el, x, y, a) { el.style.transform = "translate(" + x + "px," + y + "px)"; el.style.opacity = String(a); }
function route(k, pts) { for (let i = 0; i < pts.length - 1; i++) { if (k <= pts[i + 1][0]) { const t = ease((k - pts[i][0]) / (pts[i + 1][0] - pts[i][0])); return [pts[i][1] + (pts[i + 1][1] - pts[i][1]) * t, pts[i][2] + (pts[i + 1][2] - pts[i][2]) * t]; } } const l = pts[pts.length - 1]; return [l[1], l[2]]; }

function caps(s, n, pref) { for (let k = 0; k <= n; k++) { const a = win(s, k - 0.5, k) * (k < n ? 1 - win(s, k, k + 0.5) : 1); put($("#" + pref + k), 0, 0, clamp(a, 0, 1)); } }
const op = (id, v) => { const e = document.getElementById(id); if (e) e.setAttribute("opacity", String(Math.max(0, Math.min(1, v)))); };
const opAll = (ids, v) => ids.forEach((i) => op(i, v));

let u = 0, target = 0, frame = 0, timer = 0, last = 0;
function draw() { 
const s = u * N;
const a1 = win(s, 0, 1), a2 = win(s, 1, 2), a3 = win(s, 2, 3), a4 = win(s, 3, 4);
opAll(["c_pert1","c_pert2","c_repr1","c_repr2","c_pp","c_pr"], a1);
opAll(["c_resv1","c_resv2","c_pv","c_fe"], a2);
opAll(["c_tien1","c_tien2","c_pt"], a3);
opAll(["c_acom1","c_acom2","c_pa"], a4);
caps(s, 4, "k");
 }
function loop() {
  clearTimeout(timer); cancelAnimationFrame(frame);
  const now = performance.now();
  const dt = last ? Math.min((now - last) / 1000, 1) : 1 / 60; last = now;
  const speed = 1 / (N * 1.6);
  u = target > u ? Math.min(target, u + dt * speed) : Math.max(target, u - dt * speed * 2);
  draw();
  if (u !== target) { frame = requestAnimationFrame(loop); timer = setTimeout(loop, 80); } else { frame = 0; timer = 0; last = 0; }
}
const run = () => { if (!frame && !timer) { last = 0; loop(); } };
const go = (v) => { target = clamp(v, 0, 1); run(); };
window.__fig = { set(v) { u = target = clamp(v, 0, 1); draw(); }, go, get u() { return u; } };
addEventListener("message", (e) => { const m = e.data; if (!m || m.type !== "fig") return; if (m.mode === "set") window.__fig.set(Number(m.value)); else go(Number(m.value)); });
if (window.parent !== window) {
  const KEYMAP = { ArrowRight: "ArrowRight", PageDown: "ArrowRight", " ": "ArrowRight", Enter: "ArrowRight", ArrowLeft: "ArrowLeft", PageUp: "ArrowLeft", Backspace: "ArrowLeft" };
  addEventListener("keydown", (e) => { const k = KEYMAP[e.key]; if (!k) return; e.preventDefault(); e.stopImmediatePropagation(); parent.postMessage({ type: "deck-key", key: k }, "*"); }, true);
} else {
  addEventListener("click", () => go(target >= 1 ? 0 : Math.min(1, Math.round(target * N + 1) / N)));
}
draw();
</script></body></html>
