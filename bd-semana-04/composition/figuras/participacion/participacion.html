,'Segoe UI',sans-serif" font-weight="700" font-size="30" font-style="normal" fill="#b3261e" opacity="0">sin carrera: el pedido lo rechaza</text><text id="pa_t2" x="540" y="555" text-anchor="start" font-family="system-ui,'Segoe UI',sans-serif" font-weight="700" font-size="30" font-style="normal" fill="#0c6b62" opacity="0">sin reservas: no pasa nada</text><text id="pa_t3" x="1134" y="418" text-anchor="start" font-family="system-ui,'Segoe UI',sans-serif" font-weight="600" font-size="24" font-style="normal" fill="#0c6b62" opacity="0">ningún lector aún</text></svg>

<div id="k3" class="t" style="left:150px;top:650px;width:1260px;opacity:0;color:var(--wine-deep);font-size:30px">RESERVA: sin línea no pasa nada. Participación parcial, mínimo 0</div>
</div>
<script>
const N = 3;
const st = document.getElementById("st");
function fit() { const k = Math.min(innerWidth / 1560, innerHeight / 720); st.style.transform = "scale(" + k + ")"; }
fit(); addEventListener("resize", fit);
const $ = (s) => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const ease = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const win = (s, a, b) => ease((s - a) / (b - a));
const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, t) => { const x = hex(a), y = hex(b); return "rgb(" + x.map((v, i) => Math.round(v + (y[i] - v) * t)).join(",") + ")"; };
function lit(el, base, color, t, fg0, fg1) { el.style.background = mix(base, color, t); el.style.color = mix(fg0 || "#1f1a1d", fg1 || "#ffffff", t); }
function put(el, x, y, a) { el.style.transform = "translate(" + x + "px," + y + "px)"; el.style.opacity = String(a); }
function route(k, pts) { for (let i = 0; i < pts.length - 1; i++) { if (k <= pts[i + 1][0]) { const t = ease((k - pts[i][0]) / (pts[i + 1][0] - pts[i][0])); return [pts[i][1] + (pts[i + 1][1] - pts[i][1]) * t, pts[i][2] + (pts[i + 1][2] - pts[i][2]) * t]; } } const l = pts[pts.length - 1]; return [l[1], l[2]]; }

function caps(s, n, pref) { for (let k = 0; k <= n; k++) { const a = win(s, k - 0.5, k) * (k < n ? 1 - win(s, k, k + 0.5) : 1); put($("#" + pref + k), 0, 0, clamp(a, 0, 1)); } }
const op = (id, v) => { const e = document.getElementById(id); if (e) e.setAttribute("opacity", String(Math.max(0, Math.min(1, v)))); };
const opAll = (ids, v) => ids.forEach((i) => op(i, v));

let u = 0, target = 0, frame = 0, timer = 0, last = 0;
function draw() { 
const s = u * N;
const a1 = win(s, 0, 1), a2 = win(s, 1, 2), a3 = win(s, 2, 3);
const out = 1 - a3;
for (let k = 0; k < 4; k++) { const e = $("#pl" + k); e.setAttribute("opacity", String(out)); e.setAttribute("stroke-dasharray", "1200"); e.setAttribute("stroke-dashoffset", String(1200 * (1 - a1))); }
op("plf", out * a2); $("#plf").setAttribute("stroke-dasharray", "1200"); $("#plf").setAttribute("stroke-dashoffset", String(1200 * (1 - a2)));
for (let k = 0; k < 3; k++) { const e = $("#rl" + k); e.setAttribute("opacity", String(a3)); e.setAttribute("stroke-dasharray", "1200"); e.setAttribute("stroke-dashoffset", String(1200 * (1 - a3))); }
for (let j = 0; j < 3; j++) { op("cn" + j, out); op("ln" + j, a3); }
op("pa_h2", out); op("pa_h3", a3);
op("ering", (a1 - a2) * out); op("pa_t1", (a1 - a2) * out);
op("ering2", a3); op("pa_t2", a3); op("lring", a3); op("pa_t3", a3);
caps(s, 3, "k");
 }
function loop() {
  clearTimeout(timer); cancelAnimationFrame(frame);
  const now = performance.now();
  const dt = last ? Math.min((now - last) / 1000, 1) : 1 / 60; last = now;
  const speed = 1 / (N * 1.6);
  u = target > u ? Math.min(target, u + dt * speed) : Math.max(target, u - dt * speed * 2);
  draw();
  if (u !== target) { frame = requestAnimationFrame(loop); timer = setTimeout(loop, 80); } else { frame = 0; timer = 0; last = 0; }
}
const run = () => { if (!frame && !timer) { last = 0; loop(); } };
const go = (v) => { target = clamp(v, 0, 1); run(); };
window.__fig = { set(v) { u = target = clamp(v, 0, 1); draw(); }, go, get u() { return u; } };
addEventListener("message", (e) => { const m = e.data; if (!m || m.type !== "fig") return; if (m.mode === "set") window.__fig.set(Number(m.value)); else go(Number(m.value)); });
if (window.parent !== window) {
  const KEYMAP = { ArrowRight: "ArrowRight", PageDown: "ArrowRight", " ": "ArrowRight", Enter: "ArrowRight", ArrowLeft: "ArrowLeft", PageUp: "ArrowLeft", Backspace: "ArrowLeft" };
  addEventListener("keydown", (e) => { const k = KEYMAP[e.key]; if (!k) return; e.preventDefault(); e.stopImmediatePropagation(); parent.postMessage({ type: "deck-key", key: k }, "*"); }, true);
} else {
  addEventListener("click", () => go(target >= 1 ? 0 : Math.min(1, Math.round(target * N + 1) / N)));
}
draw();
</script></body></html>
