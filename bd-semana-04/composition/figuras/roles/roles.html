<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roles de una relación recursiva</title>
<style>
:root{--wine:#910048;--wine-deep:#6d0036;--gold:#e8a920;--teal:#0c6b62;--amber:#7a5200;--ink:#1f1a1d;--muted:#5a5257;--tint:#f6f1f3;--red:#b3261e}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;font-family:system-ui,"Segoe UI",sans-serif;color:var(--ink);overflow:hidden}
#st{position:absolute;left:0;top:0;width:1560px;height:720px;transform-origin:0 0}
.b{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border-radius:16px;padding:6px 14px;font-weight:700;font-size:32px;line-height:1.15;background:var(--tint);color:var(--ink)}
.b small{display:block;font-size:24px;font-weight:600;margin-top:4px}
.t{position:absolute;font-size:34px;font-weight:700;line-height:1.2}
.pill{position:absolute;display:flex;align-items:center;justify-content:center;height:52px;padding:0 20px;border-radius:26px;color:#fff;font:800 24px/1 ui-monospace,Consolas,monospace;white-space:nowrap;opacity:0;z-index:5}
.ln{position:absolute;background:#cfc6ca}

</style></head><body>
<div id="st">
<svg style="position:absolute;left:0;top:0;width:1560px;height:720px" viewBox="0 0 1560 720" xmlns="http://www.w3.org/2000/svg"><g id="r_l1" opacity="1"><line x1="270" y1="195" x2="270" y2="392" stroke="#910048" stroke-width="3"/></g><g id="r_l2" opacity="1"><line x1="390" y1="195" x2="390" y2="392" stroke="#910048" stroke-width="3"/></g><g id="r_e" opacity="1"><rect x="180.0" y="105.0" width="300" height="90" rx="6" fill="#910048"/><text x="330" y="161.2" text-anchor="middle" font-family="system-ui,'Segoe UI',sans-serif" font-weight="800" font-size="32" fill="#fff">ESTUDIANTE</text></g><g id="r_d" opacity="1"><polygon points="200,430 330,374 460,430 330,486" fill="#fff" stroke="#910048" stroke-width="3"/><text x="330" y="438.4" text-anchor="middle" font-family="system-ui,'Segoe UI',sans-serif" font-weight="700" font-size="24" fill="#1f1a1d">ACOMPAÑA</text></g><text id="r_mon" x="250" y="310" text-anchor="end" font-family="system-ui,'Segoe UI',sans-serif" font-weight="700" font-size="30" font-style="normal" fill="#0c6b62" opacity="0">monitor</text><text id="r_aco" x="410" y="310" text-anchor="start" font-family="system-ui,'Segoe UI',sans-serif" font-weight="700" font-size="30" font-style="normal" fill="#910048" opacity="0">acompañado</text><text id="r_q" x="330" y="540" text-anchor="middle" font-family="system-ui,'Segoe UI',sans-serif" font-weight="700" font-size="30" font-style="normal" fill="#b3261e" opacity="0">¿Cuál línea es cuál?</text></svg>
<div id="i0a" class="b" style="left:800px;top:170px;width:230px;height:84px;font-size:34px;opacity:0">Lucía</div>
<div id="i0t" class="t" style="left:1040px;top:192px;width:230px;text-align:center;font-size:28px;color:var(--muted);opacity:0">acompaña a</div>
<div id="i0b" class="b" style="left:1280px;top:170px;width:230px;height:84px;font-size:34px;opacity:0">Ana</div>
<div id="i0ra" class="t" style="left:800px;top:262px;width:230px;text-align:center;font-size:26px;color:#0c6b62;opacity:0">monitor</div>
<div id="i0rb" class="t" style="left:1280px;top:262px;width:230px;text-align:center;font-size:26px;color:#910048;opacity:0">acompañado</div>
<div id="i1a" class="b" style="left:800px;top:360px;width:230px;height:84px;font-size:34px;opacity:0">Ana</div>
<div id="i1t" class="t" style="left:1040px;top:382px;width:230px;text-align:center;font-size:28px;color:var(--muted);opacity:0">acompaña a</div>
<div id="i1b" class="b" style="left:1280px;top:360px;width:230px;height:84px;font-size:34px;opacity:0">Diego</div>
<div id="i1ra" class="t" style="left:800px;top:452px;width:230px;text-align:center;font-size:26px;color:#0c6b62;opacity:0">monitor</div>
<div id="i1rb" class="t" style="left:1280px;top:452px;width:230px;text-align:center;font-size:26px;color:#910048;opacity:0">acompañado</div>
<div id="k0" class="t" style="left:30px;top:610px;width:1500px;opacity:0;color:var(--wine-deep);font-size:32px">Las dos líneas llegan al mismo rectángulo</div>
<div id="k1" class="t" style="left:30px;top:610px;width:1500px;opacity:0;color:var(--wine-deep);font-size:32px">El nombre de rol dice qué papel juega cada línea</div>
<div id="k2" class="t" style="left:30px;top:610px;width:1500px;opacity:0;color:var(--wine-deep);font-size:32px">Ana tiene los dos roles a la vez: la acompaña Lucía y ella acompaña a Diego</div>
</div>
<script>
const N = 2;
const st = document.getElementById("st");
function fit() { const k = Math.min(innerWidth / 1560, innerHeight / 720); st.style.transform = "scale(" + k + ")"; }
fit(); addEventListener("resize", fit);
const $ = (s) => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const ease = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const win = (s, a, b) => ease((s - a) / (b - a));
const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, t) => { const x = hex(a), y = hex(b); return "rgb(" + x.map((v, i) => Math.round(v + (y[i] - v) * t)).join(",") + ")"; };
function lit(el, base, color, t, fg0, fg1) { el.style.background = mix(base, color, t); el.style.color = mix(fg0 || "#1f1a1d", fg1 || "#ffffff", t); }
function put(el, x, y, a) { el.style.transform = "translate(" + x + "px," + y + "px)"; el.style.opacity = String(a); }
function route(k, pts) { for (let i = 0; i < pts.length - 1; i++) { if (k <= pts[i + 1][0]) { const t = ease((k - pts[i][0]) / (pts[i + 1][0] - pts[i][0])); return [pts[i][1] + (pts[i + 1][1] - pts[i][1]) * t, pts[i][2] + (pts[i + 1][2] - pts[i][2]) * t]; } } const l = pts[pts.length - 1]; return [l[1], l[2]]; }

function caps(s, n, pref) { for (let k = 0; k <= n; k++) { const a = win(s, k - 0.5, k) * (k < n ? 1 - win(s, k, k + 0.5) : 1); put($("#" + pref + k), 0, 0, clamp(a, 0, 1)); } }
const op = (id, v) => { const e = document.getElementById(id); if (e) e.setAttribute("opacity", String(Math.max(0, Math.min(1, v)))); };
const opAll = (ids, v) => ids.forEach((i) => op(i, v));

let u = 0, target = 0, frame = 0, timer = 0, last = 0;
function draw() { 
const s = u * N;
const a1 = win(s, 0, 1), a2 = win(s, 1, 2);
op("r_mon", a1); op("r_aco", a1); op("r_q", 1 - a1);
for (let r = 0; r < 2; r++) for (const k of ["a", "t", "b", "ra", "rb"]) put($("#i" + r + k), 0, (1 - a2) * 24, a2);
lit($("#i0b"), "#f6f1f3", "#e8a920", a2, "#1f1a1d", "#1f1a1d");
lit($("#i1a"), "#f6f1f3", "#e8a920", a2, "#1f1a1d", "#1f1a1d");
caps(s, 2, "k");
 }
function loop() {
  clearTimeout(timer); cancelAnimationFrame(frame);
  const now = performance.now();
  const dt = last ? Math.min((now - last) / 1000, 1) : 1 / 60; last = now;
  const speed = 1 / (N * 1.6);
  u = target > u ? Math.min(target, u + dt * speed) : Math.max(target, u - dt * speed * 2);
  draw();
  if (u !== target) { frame = requestAnimationFrame(loop); timer = setTimeout(loop, 80); } else { frame = 0; timer = 0; last = 0; }
}
const run = () => { if (!frame && !timer) { last = 0; loop(); } };
const go = (v) => { target = clamp(v, 0, 1); run(); };
window.__fig = { set(v) { u = target = clamp(v, 0, 1); draw(); }, go, get u() { return u; } };
addEventListener("message", (e) => { const m = e.data; if (!m || m.type !== "fig") return; if (m.mode === "set") window.__fig.set(Number(m.value)); else go(Number(m.value)); });
if (window.parent !== window) {
  const KEYMAP = { ArrowRight: "ArrowRight", PageDown: "ArrowRight", " ": "ArrowRight", Enter: "ArrowRight", ArrowLeft: "ArrowLeft", PageUp: "ArrowLeft", Backspace: "ArrowLeft" };
  addEventListener("keydown", (e) => { const k = KEYMAP[e.key]; if (!k) return; e.preventDefault(); e.stopImmediatePropagation(); parent.postMessage({ type: "deck-key", key: k }, "*"); }, true);
} else {
  addEventListener("click", () => go(target >= 1 ? 0 : Math.min(1, Math.round(target * N + 1) / N)));
}
draw();
</script></body></html>
