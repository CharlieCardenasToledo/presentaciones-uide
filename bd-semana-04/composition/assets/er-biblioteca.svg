  <text x="30" y="40" font-size="13" fill="#5a5257">1, N y M: razón de cardinalidad. Línea doble: participación total. Línea sencilla: parcial.</text>
  <text x="30" y="60" font-size="13" fill="#5a5257">Rectángulo y rombo dobles: entidad débil y su relación identificadora.</text>
