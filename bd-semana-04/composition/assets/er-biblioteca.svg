<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, sans-serif">
  <title id="t">Diagrama ER de la biblioteca con razones de cardinalidad y participación</title>
  <desc id="d">Cuatro tipos de entidad y cinco tipos de relación. ESTUDIANTE pertenece a CARRERA, de muchos a uno, con participación total de los dos lados. ESTUDIANTE representa a CARRERA, de uno a uno, con participación total de la carrera. ESTUDIANTE reserva LIBRO, de muchos a muchos, con el atributo fecha_reserva en la relación. LIBRO tiene EJEMPLAR, que es una entidad débil con la clave parcial número_ejemplar. ESTUDIANTE acompaña a ESTUDIANTE, relación recursiva con los roles monitor y acompañado.</desc>
